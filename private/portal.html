<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainee Portal · Esperon</title>
<script>
  (function(){var t=null;try{t=localStorage.getItem('esperon-theme')}catch(e){}
  if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t)})();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/portal.css" rel="stylesheet">
</head>
<body class="portal">
  <aside class="side">
    <div class="logo-row">
      <span class="logo"><i class="bi bi-droplet-half"></i></span>
      <div><b>ESPERON</b><small>Trainee Portal</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Portal">
      <a href="#overview"><i class="bi bi-grid"></i>Overview</a>
      <a href="#application"><i class="bi bi-file-earmark-text"></i>Application</a>
      <a href="#profile"><i class="bi bi-person"></i>My information</a>
      <a href="#assessments"><i class="bi bi-ui-checks"></i>Assessments</a>
      <a href="#results"><i class="bi bi-bar-chart"></i>Results</a>
      <a href="#payments"><i class="bi bi-wallet2"></i>Payments</a>
      <a href="#care"><i class="bi bi-clipboard2-check"></i>Cow care</a>
    </nav>
    <div class="side-foot">
      <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"><i class="bi bi-moon-stars i-moon"></i><i class="bi bi-sun i-sun"></i></button>
      <button type="button" class="btn-g" id="out"><i class="bi bi-box-arrow-right"></i> Log out</button>
    </div>
  </aside>

  <main class="main"><div id="view" aria-live="polite"></div></main>
  <div id="toast" role="status"></div>

  <script src="../src/main.js"></script>
  <script src="../src/portal.js"></script>
</body>
</html>
